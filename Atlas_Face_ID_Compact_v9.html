<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040507">
<title>Atlas — Unlock</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#040507;
    --fg:#f5f5f7;
    --muted:#8b8c93;
    --dim:#62636b;
    --line:rgba(255,255,255,.14);
    --panel:rgba(255,255,255,.03);
    --button:#f3f3f5;
    --button-ink:#0c0d10;
    --green:#32d74b;
    --red:#d70015;
    --ease:cubic-bezier(.22,.85,.22,1);
    --slot-width:38px;
    --slot-gap:8px;
    --pin-width:calc(4 * var(--slot-width) + 3 * var(--slot-gap));
  }
  html[data-theme="light"]{
    color-scheme:light;
    --bg:#f4f4f6;
    --fg:#16171b;
    --muted:#6f7077;
    --dim:#8b8c93;
    --line:rgba(0,0,0,.12);
    --panel:rgba(0,0,0,.03);
    --button:#15161a;
    --button-ink:#ffffff;
    --green:#34c759;
    --red:#d70015;
  }
  *{box-sizing:border-box}
  html,body{width:100%;min-height:100%;margin:0;-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button,input{font:inherit}
  button{cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:4px}

  .page{
    min-height:100svh;
    display:grid;
    grid-template-rows:1fr;
    padding:0 40px;
    position:relative;
  }
  /* One useful system control, without branding, header copy, or decoration. */
  .theme-toggle{
    position:absolute;top:24px;right:28px;z-index:5;
    width:32px;height:32px;padding:0;
    display:grid;place-items:center;
    color:var(--muted);background:transparent;border:0;border-radius:10px;
    transition:color .15s ease,background .15s ease;
  }
  .theme-toggle:hover{color:var(--fg);background:var(--panel)}
  .theme-toggle svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .theme-toggle .moon{display:none}
  html[data-theme="light"] .theme-toggle .sun{display:none}
  html[data-theme="light"] .theme-toggle .moon{display:block}

  .main{display:grid;place-items:center;padding:20px 0}
  .auth{
    width:var(--pin-width);
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }

  .face-zone{position:relative;display:grid;justify-items:center;gap:0}
  /* Overlay result text without changing the fixed-size authentication layout. */
  .success-title{
    position:absolute;top:calc(100% + 16px);left:50%;transform:translateX(-50%);
    margin:0;white-space:nowrap;font-size:21px;font-weight:650;line-height:36px;
    letter-spacing:-.045em;opacity:0;visibility:hidden;transition:opacity .16s ease;
  }
  .auth.is-unlocked .success-title{visibility:visible;opacity:1}
  .auth.is-unlocked .pin-block{visibility:hidden;pointer-events:none}
  .auth.is-unlocked .status{visibility:hidden}

  /* The green ribbon-to-smile sequence follows the supplied iPhone video.
     The mark is strictly 36px and keeps one fixed layout position. */
  .face-mark{width:36px;height:36px;position:relative;display:grid;place-items:center;color:var(--fg);isolation:isolate}
  .face-core,.scan-ribbons,.smile-result,.failure-result{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .face-core{transition:opacity .16s ease, transform .25s var(--ease)}
  .face-core path{stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .scan-ribbons{opacity:0;transform:scale(.65) rotate(-40deg);transition:opacity .12s ease;pointer-events:none;color:var(--green)}
  .scan-ribbons ellipse{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;transform-box:fill-box;transform-origin:center}
  .scan-ribbons .ribbon-one{stroke-width:3.4;opacity:.95}
  .scan-ribbons .ribbon-two{stroke-width:2.1;opacity:.55}
  .scan-ribbons .ribbon-glow{stroke-width:5;opacity:.6;filter:blur(3px)}
  .face-mark.scanning .face-core{opacity:0;transform:scale(.76)}
  .face-mark.scanning .scan-ribbons{opacity:1;animation:ribbon-rise .72s cubic-bezier(.16,.9,.24,1) forwards}
  .face-mark.scanning .ribbon-one{animation:ribbon-turn .68s cubic-bezier(.24,.55,.31,1) both}
  .face-mark.scanning .ribbon-two{animation:ribbon-cross .66s cubic-bezier(.24,.55,.31,1) both}
  .face-mark.scanning .ribbon-glow{animation:ribbon-turn .68s cubic-bezier(.24,.55,.31,1) both}
  .smile-result,.failure-result{opacity:0;transform:scale(.82);transition:opacity .10s, transform .25s cubic-bezier(.2,.9,.2,1)}
  .smile-result{color:var(--green);filter:drop-shadow(0 0 2px rgba(50,215,75,.16))}
  .failure-result{color:var(--red)}
  .smile-result circle,.smile-result path,.failure-result circle,.failure-result path{
    fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:110;stroke-dashoffset:110;
  }
  .face-mark.success .face-core,.face-mark.failure .face-core{opacity:0;transform:scale(.72)}
  .face-mark.success .smile-result,.face-mark.failure .failure-result{opacity:1;transform:scale(1)}
  .face-mark.success .smile-result circle{animation:draw .34s ease-out .02s forwards}
  .face-mark.success .smile-result path{animation:draw .20s ease-out .14s forwards}
  .face-mark.failure .failure-result circle{animation:draw .28s ease-out .02s forwards}
  .face-mark.failure .failure-result path{animation:draw .19s ease-out .16s forwards}
  @keyframes ribbon-rise{
    0%{transform:scale(.48) rotate(-65deg);filter:blur(3px);opacity:.35}
    38%{transform:scale(1.03) rotate(25deg);filter:blur(.6px);opacity:1}
    78%{transform:scale(1) rotate(95deg);filter:blur(0);opacity:1}
    100%{transform:scale(.94) rotate(120deg);filter:blur(.2px);opacity:1}
  }
  @keyframes ribbon-turn{
    0%{transform:rotate(-75deg) scale(.7,1.15)}
    46%{transform:rotate(82deg) scale(1.18,.88)}
    100%{transform:rotate(198deg) scale(1,.98)}
  }
  @keyframes ribbon-cross{
    0%{transform:rotate(77deg) scale(1.2,.8)}
    48%{transform:rotate(-84deg) scale(.88,1.1)}
    100%{transform:rotate(-178deg) scale(1,1)}
  }

  /* Feedback sits below the button and never changes the icon-to-PIN spacing. */
  .status{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;max-width:calc(100vw - 24px);color:var(--muted);font-size:10px;line-height:1.4;opacity:0;pointer-events:none}
  .status.success{color:var(--green);opacity:1}
  .status.failure{color:var(--red);opacity:1}

  .pin-block{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;width:var(--pin-width);margin-top:20px}
  .pin-slots{display:flex;gap:var(--slot-gap);position:relative;cursor:text;width:var(--pin-width)}
  .slot{width:var(--slot-width);flex:0 0 var(--slot-width);height:42px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;transition:border-color .14s ease, background .14s ease}
  .slot.active{border-color:rgba(255,255,255,.85)}
  html[data-theme="light"] .slot.active{border-color:rgba(0,0,0,.85)}
  .slot.filled::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--fg)}
  /* The active box uses only a border; no extra blinking cursor. */
  .pin-input{position:absolute;inset:0;opacity:0;border:0;outline:none;background:transparent;color:transparent;caret-color:transparent}
  /* Exact spacing: boxes -> label 5px; label -> button 20px. */
  .pin-label{color:var(--dim);font-size:9px;letter-spacing:.10em;text-transform:uppercase;line-height:12px;height:12px;margin-top:5px}
  .primary{width:var(--pin-width);height:42px;min-height:42px;margin-top:20px;padding:0 12px;white-space:nowrap;border-radius:12px;border:0;background:var(--button);color:var(--button-ink);font-size:13px;font-weight:650;letter-spacing:-.02em;transition:transform .18s,filter .18s,opacity .18s}
  .primary:hover:not(:disabled){transform:translateY(-1px);filter:brightness(.98)}
  .primary:active:not(:disabled){transform:scale(.992)}
  .primary:disabled{opacity:.72;cursor:default}
  .secondary{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:500;padding:5px 9px;transition:color .18s ease}
  .secondary:hover{color:var(--fg)}


  @keyframes draw{to{stroke-dashoffset:0}}

  @media (max-width:900px){
    .page{padding:0 22px}
    .theme-toggle{top:20px;right:22px}
  }
  @media (max-width:600px){
    /* Mobile only: anchor the whole fixed-size login group above the native keypad.
       --mobile-auth-top is captured once BEFORE the keyboard can resize the viewport. */
    html,body{height:100%;overflow:hidden}
    .page{padding:0 16px;height:100svh;min-height:100svh;overflow:hidden}
    .main{place-items:start center;padding-top:var(--mobile-auth-top,26svh);padding-bottom:0}
    .theme-toggle{top:16px;right:16px}
    .auth{gap:0}
    .face-zone{gap:0}
    .face-mark{width:36px;height:36px}
    .status{font-size:10px}
    .slot{width:var(--slot-width);height:42px;border-radius:11px}
    .pin-input{font-size:16px} /* iOS does not auto-zoom numeric inputs >= 16px */
    .primary{height:42px;min-height:42px;border-radius:12px;font-size:13px}
    .secondary{font-size:11px}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
  <div class="page">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light theme" title="Toggle light/dark theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 14.1A8.8 8.8 0 0 1 9.9 3.7 8.8 8.8 0 1 0 20.3 14.1Z"/></svg>
    </button>

    <main class="main">
      <section class="auth" id="auth">
        <div class="face-zone" id="faceZone">
          <div class="face-mark" id="faceMark" aria-hidden="true">
            <svg class="face-core" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <path d="M15 10h-1.4c-3 0-4.6 1.7-4.6 4.7V16"/>
              <path d="M33 10h1.4c3 0 4.6 1.7 4.6 4.7V16"/>
              <path d="M9 31.8V33c0 3 1.6 5 4.8 5H15"/>
              <path d="M39 31.8V33c0 3-1.6 5-4.8 5H33"/>
              <path d="M18 19.7v4.3M30 19.7v4.3M24 19.5v8h-3"/>
              <path d="M17.6 31c3.2 4 9.6 4 12.8 0"/>
            </svg>
            <svg class="scan-ribbons" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <ellipse class="ribbon-glow" cx="24" cy="24" rx="17" ry="12" />
              <ellipse class="ribbon-one" cx="24" cy="24" rx="17" ry="12" />
              <ellipse class="ribbon-two" cx="24" cy="24" rx="12" ry="17" />
            </svg>
            <svg class="smile-result" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <circle cx="24" cy="24" r="19"/>
              <path d="M15 18v5M23 18v10h-3M32.5 18v5M15.5 31c4 5 13.2 5 17 0" />
            </svg>
            <svg class="failure-result" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <circle cx="24" cy="24" r="17"/>
              <path d="M19 19l10 10m0-10L19 29" />
            </svg>
          </div>
          <h2 class="success-title" id="successTitle" aria-live="polite">Unlocked</h2>
        </div>

        <div class="pin-block" id="pinBlock">
          <label class="pin-slots" id="pinSlots" aria-label="4-digit passcode">
            <span class="slot active"></span>
            <span class="slot"></span>
            <span class="slot"></span>
            <span class="slot"></span>
            <input class="pin-input" id="pinInput" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" enterkeyhint="done" aria-label="Enter 4 digit passcode">
          </label>
          <div class="pin-label">4-Digit Passcode</div>
          <button class="primary" id="unlockButton" type="button">Unlock</button>
          <div class="status" id="statusText" role="status" aria-live="polite"></div>
        </div>
      </section>

    </main>

  </div>

<script>
(() => {
  const root = document.documentElement;
  const auth = document.getElementById('auth');
  const faceMark = document.getElementById('faceMark');
  const statusText = document.getElementById('statusText');
  const pinInput = document.getElementById('pinInput');
  const pinSlots = [...document.querySelectorAll('.slot')];
  const unlockButton = document.getElementById('unlockButton');
  // Put this file beside your actual Atlas main page, or change the URL below.
  const ATLAS_MAIN_PAGE = 'index.html';
  const UNLOCK_HOLD_MS = 500;
  const INITIAL_FACE_DELAY_MS = 500;
  // Anchor the mobile authentication group above the keypad. The top position is
  // deliberately captured once: keyboard visualViewport resizing must not move it.
  if (window.matchMedia('(max-width: 600px)').matches) {
    const initialHeight = window.innerHeight;
    const top = Math.min(265, Math.max(136, Math.round(initialHeight * 0.26)));
    root.style.setProperty('--mobile-auth-top', top + 'px');
  }

  const themeToggle = document.getElementById('themeToggle');
  function setTheme(theme) {
    root.dataset.theme = theme;
    const light = theme === 'light';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f4f4f6' : '#040507');
    themeToggle.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
    try { localStorage.setItem('atlas-auth-theme', theme); } catch {}
  }
  themeToggle.addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
  try {
    const saved = localStorage.getItem('atlas-auth-theme');
    if(saved === 'light' || saved === 'dark') setTheme(saved);
    else themeToggle.setAttribute('aria-label', 'Switch to light theme');
  } catch {}

  let timer = null;
  let faceState = 'idle';

  function clearTimer(){ if(timer){ clearTimeout(timer); timer = null; } }


  function renderPin(){
    const count = pinInput.value.length;
    pinSlots.forEach((slot, index) => {
      slot.classList.toggle('filled', index < count);
      slot.classList.toggle('active', index === Math.min(count, 3));
    });
  }

  function setStatus(text, state=''){
    statusText.textContent = text;
    statusText.className = 'status' + (state ? ' ' + state : '');
  }

  function resetPasscode(){
    pinInput.value = '';
    unlockButton.disabled = false;
    unlockButton.textContent = 'Unlock';
    renderPin();
  }

  function showAuth(){
    // Returning to auth never alters its geometry, even after success.
    auth.classList.remove('is-unlocked');
  }

  function showUnlocked(){
    clearTimer();
    faceState = 'success';
    pinInput.blur();
    // Same centered 36px location; green smile is revealed without moving the layout.
    faceMark.className = 'face-mark success';
    auth.classList.add('is-unlocked');
    setStatus('', '');
    timer = setTimeout(() => {
      window.location.replace(ATLAS_MAIN_PAGE);
    }, UNLOCK_HOLD_MS);
  }

  function startFaceID(outcome='failure'){
    clearTimer();
    faceState = 'scanning';
    faceMark.className = 'face-mark scanning';
    setStatus('Scanning with Face ID…');
    timer = setTimeout(() => {
      faceState = outcome;
      faceMark.className = 'face-mark ' + outcome;
      if(outcome === 'success') {
        showUnlocked();
      } else {
        setStatus('Face ID unavailable', 'failure');
        unlockButton.disabled = false;
        pinInput.focus({ preventScroll: true });
        try { pinInput.setSelectionRange(pinInput.value.length, pinInput.value.length); } catch {}
      }
    }, 710);
  }

  function unlockWithPasscode(){
    if(pinInput.value.length !== 4){
      setStatus('Passcode required', 'failure');
      pinInput.focus({ preventScroll: true });
      return;
    }
    unlockButton.disabled = true;
    unlockButton.textContent = 'Unlocking…';
    clearTimer();
    faceState = 'scanning';
    faceMark.className = 'face-mark scanning';
    setStatus('', '');
    timer = setTimeout(showUnlocked, 710);
  }

  document.getElementById('pinSlots').addEventListener('click', () => pinInput.focus({ preventScroll: true }));
  pinInput.addEventListener('input', () => {
    pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
    renderPin();
    if(faceState === 'idle' && pinInput.value.length > 0) clearTimer();
    if(faceState === 'failure') setStatus('Face ID unavailable', 'failure');
    if(pinInput.value.length === 4) unlockWithPasscode();
  });

  unlockButton.addEventListener('click', unlockWithPasscode);


  resetPasscode();
  showAuth();
  // Show the actual Face ID icon, unchanged, for a full 0.5s before scanning.
  const autoOutcome = new URLSearchParams(location.search).get('face') === 'success' ? 'success' : 'failure';
  faceMark.className = 'face-mark';
  setStatus('', '');
  faceState = 'idle';
  timer = setTimeout(() => {
    timer = null;
    if(faceState === 'idle' && pinInput.value.length === 0) startFaceID(autoOutcome);
  }, INITIAL_FACE_DELAY_MS);
})();
</script>
</body>
</html>
